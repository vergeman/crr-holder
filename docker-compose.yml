version: "3.8"

services:
  api:
    build: ./api
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./api:/app
      - ./db/crr:/data:ro

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules

volumes:
  web_node_modules:
